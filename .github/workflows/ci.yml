name: misc-lab CI
on:
  push: { branches: [miscellaneous] }
  pull_request: { branches: [miscellaneous] }

jobs:
  backend:
    runs-on: ubuntu-latest          # Docker is preinstalled -> Testcontainers ITs work
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # The stack's images need more than the ~14 GB a hosted runner leaves free ("No space left on device")
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-java@v4
        with: { distribution: corretto, java-version: "21", cache: maven }
      - name: Unit tests + integration tests (*IT via failsafe)
        run: ./mvnw -B verify

  spark:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: spark } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: corretto, java-version: "21", cache: maven }
      - run: ../backend/mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  frontend-angular:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend-angular } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend-angular/package-lock.json }
      - run: npm ci
      - run: npm test

  python-svc:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python-svc } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: pytest -q

  go-verify:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go-verify } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - run: go vet ./... && go test -v ./...

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules + config
        run: |
          docker run --rm -v $PWD/observability:/w --entrypoint promtool prom/prometheus:v2.54.1 check rules /w/alert-rules.yml
          docker run --rm -v $PWD/observability:/w --entrypoint promtool prom/prometheus:v2.54.1 check config --syntax-only /w/prometheus.yml
      - name: docker compose config
        run: docker compose config -q
