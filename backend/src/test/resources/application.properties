# Every Spring test context gets a real PostgreSQL 16 from Testcontainers through the jdbc:tc driver.
# TC_DAEMON keeps one container for the whole JVM, shared across cached contexts; Flyway migrates it on first use.
spring.datasource.url=jdbc:tc:postgresql:16:///misclab?TC_DAEMON=true
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
