server:
  port: 8090
spring:
  application:
    name: misc-lab
  graphql:
    graphiql:
      enabled: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/misclab
logging:
  structured:
    format:
      console: ecs          # JSON structured logs (Spring Boot 3.4+ built-in)
misclab:
  aws:
    endpoint: http://localhost:4566
    region: ap-south-1
    access-key: test
    secret-key: test
    bucket: misc-receipts
    queue: receipt-events
    table: receipts
    init-resources: true    # create bucket/queue/table on startup (LocalStack convenience)
  azure:
    enabled: false          # true + Azurite (or a real connection string) to archive receipts to Azure Blob
    connection-string: UseDevelopmentStorage=true  # Azurite/dev; override with a real Azure connection string when enabled
    container: receipts
  oidc:
    hmac-secret: "misclab-oidc-hmac-secret-key-32b!"
  es:
    base-url: http://localhost:9200
  llm:
    base-url: http://localhost:4010
    api-key: test-not-a-real-key
  poller:
    enabled: true
fx:
  base-url: http://localhost:8099
  connect-timeout: 500ms
  read-timeout: 1s
  fallback-rate: 0.0119
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
resilience4j:
  retry:
    instances:
      fx:
        max-attempts: 2
        wait-duration: 100ms
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      fx:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        register-health-indicator: true
