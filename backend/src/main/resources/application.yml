server:
  port: 8090
spring:
  application:
    name: misc-lab
  graphql:
    graphiql:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5433/misclab
    username: misclab
    password: misclab     # lab value (docker-compose); real one comes from a secret store
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate  # Flyway owns the schema; Hibernate only checks the entities match it
  flyway:
    enabled: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/misclab
    redis:
      host: localhost
      port: 6379
  cache:
    cache-names: fxRates,receipts   # known at startup so Micrometer binds cache.gets{result=hit|miss} for both
    redis:
      enable-statistics: true
  rabbitmq:
    host: localhost
    port: 5672
    listener:
      simple:
        default-requeue-rejected: false   # a failing message goes to the dead-letter exchange, never loops forever
  cassandra:
    keyspace-name: misclab
    local-datacenter: datacenter1
    contact-points: localhost:9042
  webservices:
    path: /ws
  autoconfigure:
    # Cassandra connects eagerly at startup; only turned on with misclab.cassandra.enabled=true
    # (and by CassandraReceiptHistoryIT, which clears this list).
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraReactiveRepositoriesAutoConfiguration
logging:
  structured:
    format:
      console: ecs          # JSON structured logs (Spring Boot 3.4+ built-in)
misclab:
  aws:
    endpoint: http://localhost:4566
    region: ap-south-1
    access-key: test
    secret-key: test
    bucket: misc-receipts
    queue: receipt-events
    table: receipts
    init-resources: true    # create bucket/queue/table on startup (LocalStack convenience)
  azure:
    enabled: false          # true + Azurite (or a real connection string) to archive receipts to Azure Blob
    connection-string: UseDevelopmentStorage=true  # Azurite/dev; override with a real Azure connection string when enabled
    container: receipts
  oidc:
    hmac-secret: "misclab-oidc-hmac-secret-key-32b!"
  gcp:                      # used only with profile "gcp"
    project-id: misclab-local
    topic: receipt-created
    bucket: misc-receipts-gcs
    pubsub-emulator-host: localhost:8085   # blank for real GCP
    storage-endpoint: http://localhost:4443 # blank for real GCP
  es:
    base-url: http://localhost:9200
  llm:
    base-url: http://localhost:4010
    api-key: test-not-a-real-key
  poller:
    enabled: true
  cache:
    enabled: false          # true = Redis cache-aside for FX rates + receipt lookups (needs Redis)
    fx-ttl: 10m
    receipt-ttl: 1h
  rabbit:
    enabled: false          # true = publish ReceiptCreated to RabbitMQ + consume with a DLQ (needs RabbitMQ)
  cassandra:
    enabled: false          # true = receipts_by_payer time series in Cassandra (also remove the autoconfigure excludes)
  payments:
    webhook-secret: whsec_misclab_lab_only   # lab value; real one comes from a secret store
    webhook-url: ""                         # blank = keep in outbox only; set to POST signed events
fx:
  base-url: http://localhost:8099
  connect-timeout: 500ms
  read-timeout: 1s
  fallback-rate: 0.0119
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: false        # optional lab dependencies: don't mark the app DOWN when they aren't running
    rabbit:
      enabled: false
resilience4j:
  retry:
    instances:
      fx:
        max-attempts: 2
        wait-duration: 100ms
        ignore-exceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
  circuitbreaker:
    instances:
      fx:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        register-health-indicator: true
