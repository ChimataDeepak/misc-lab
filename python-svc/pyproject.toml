[project]
name = "receipt-insights"
version = "0.1.0"
description = "FastAPI service that summarises misc-lab receipts (totals by currency, top payers)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
receipt-insights = "receipt_insights.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["receipt_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
