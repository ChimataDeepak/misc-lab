# SLO: 99.5% of /api/receipts requests succeed (non-5xx) over 30 days.
# Error budget = 0.5%. Multi-window burn-rate alerts (Google SRE workbook):
#   fast burn 14.4x over 1h AND 5m -> page (2% of monthly budget burned in 1h)
#   slow burn 6x   over 6h AND 30m -> ticket
groups:
  - name: receipts-slo-recording
    rules:
      - record: receipts:error_ratio:rate5m
        expr: |
          sum(rate(http_server_requests_seconds_count{uri="/api/receipts",status=~"5.."}[5m]))
          / sum(rate(http_server_requests_seconds_count{uri="/api/receipts"}[5m]))
      - record: receipts:error_ratio:rate30m
        expr: |
          sum(rate(http_server_requests_seconds_count{uri="/api/receipts",status=~"5.."}[30m]))
          / sum(rate(http_server_requests_seconds_count{uri="/api/receipts"}[30m]))
      - record: receipts:error_ratio:rate1h
        expr: |
          sum(rate(http_server_requests_seconds_count{uri="/api/receipts",status=~"5.."}[1h]))
          / sum(rate(http_server_requests_seconds_count{uri="/api/receipts"}[1h]))
      - record: receipts:error_ratio:rate6h
        expr: |
          sum(rate(http_server_requests_seconds_count{uri="/api/receipts",status=~"5.."}[6h]))
          / sum(rate(http_server_requests_seconds_count{uri="/api/receipts"}[6h]))
  - name: receipts-slo-alerts
    rules:
      - alert: ReceiptsErrorBudgetFastBurn
        expr: receipts:error_ratio:rate1h > (14.4 * 0.005) and receipts:error_ratio:rate5m > (14.4 * 0.005)
        labels: { severity: page, slo: receipts-availability }
        annotations:
          summary: "Receipts burning error budget 14.4x (99.5% SLO)"
      - alert: ReceiptsErrorBudgetSlowBurn
        expr: receipts:error_ratio:rate6h > (6 * 0.005) and receipts:error_ratio:rate30m > (6 * 0.005)
        for: 15m
        labels: { severity: ticket, slo: receipts-availability }
        annotations:
          summary: "Receipts burning error budget 6x (99.5% SLO)"
      - alert: FxCallSlow
        # p95 of the outbound FX call above 500ms for 10m
        expr: histogram_quantile(0.95, sum by (le) (rate(fx_call_seconds_bucket[5m]))) > 0.5
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: "FX provider p95 latency > 500ms"
